<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dflex – Who's Watching?</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/landing.css">
  <link rel="stylesheet" href="css/main.css">
  <style>
    body {
      margin: ;
      background-color: #141414;
      font-family: 'Roboto', sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    h1 {
      font-size: 4rem;
      margin-bottom: 40px;
      opacity: 0;
    }
    .profiles {
      display: flex;
      gap: 2rem;
      opacity: 0;
      padding-bottom: 20px;
    }
    .profile {
      width: 300px;
      height: 300px;
      border-radius: 10px;
      background-color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s ease, background-color 0.3s ease;
      cursor: pointer;
      text-decoration: none;
      color: white;
    }
    .profile:hover {
      transform: scale(1.05);
      background-color: #e50914;
    }
    .profile img {
      width: 50%;
      height: 50%;
      margin-bottom: 10px;
      border-radius: 50%;
      border: 3px solid #110f0f;
      
    }
    .profile span {
      font-size: 1.5rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Who's Watching?</h1>
  <div class="profiles">
    <a href="recruiter.html" class="profile">
      <img src="assets/Rec.png" alt="Recruiter Icon">
      <span>Recruiter</span>
    </a>
    <a href="friend.html" class="profile">
      <img src="assets/Fri.png" alt="Friend Icon">
      <span>Friend</span>
    </a>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/landing.js"></script>
</body>
</html>
